[package]
name = "rust_lib_homot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
dashmap = "6.1.0"
fjall = "2.11.2"
flutter_rust_bridge = "=2.11.1"
rand = "=0.9.1"
rayon = "1.11.0"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
