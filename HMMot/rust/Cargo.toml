[package]
name = "rust_lib_hviewer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.9.0"
anyhow = "=1.0.97"
glob = "0.3.2"
serde = {version="1.0.218", features = ["derive"]}
fjall="2.6.5"
rmp-serde = "1.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
